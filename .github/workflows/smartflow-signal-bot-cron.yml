name: SmartFlow Bot Cron

# نظام Smart Flow PRO MAX (نسخة معايَرة) — نظام موازٍ مستقل عن الأنظمة الأخرى
# (Target Trend / QAA / السعودي): حالة وكاش حكم شرعي وسجل إشارات منفصلة،
# ولا يقرأ ولا يكتب ملفات الأنظمة الأخرى.
# الفرضية v1.1 قيد المعايرة مع لقطات نسخة البائع — انظر README_SMARTFLOW.md والـ handoff.

on:
  schedule:
    - cron: '*/5 * * * *'  # كل 5 دقائق UTC — كشف إغلاق شمعة الساعة (كلا الشكلين: بلا بيانات = دورة سريعة)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smartflow-signal-bot-cron
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIMEZONE: Asia/Riyadh
      BINANCE_BASE_URL: https://data-api.binance.vision
      BINANCE_QUOTE_ASSET: USDT
      REQUEST_TIMEOUT: 20
      MAX_WORKERS: 10
      HALAL_REFRESH_HOURS: 6
      LOG_LEVEL: INFO
      # ── Smart Flow — مسارات النظام الموازية المنفصلة ──
      SMARTFLOW_STATE_FILE: data/state_smartflow.json
      SMARTFLOW_HALAL_DIR: data/smartflow
      SMARTFLOW_SIGNALS_LOG: data/smartflow/signals_log.csv
      SMARTFLOW_KLINE_LIMIT: "200"
      SMARTFLOW_MAX_CATCHUP_HOURS: "24"
      # ── قواعد الفرضية v1.1 (تُعايَر مع لقطات نسخة البائع) ──
      SMARTFLOW_EMA_LEN: "20"
      SMARTFLOW_EMA_SLOW_LEN: "50"
      SMARTFLOW_EMA_FAST_LEN: "10"
      SMARTFLOW_SMA_LEN: "20"
      SMARTFLOW_RSI_LEN: "14"
      SMARTFLOW_BUY_RSI_MIN: "45"
      SMARTFLOW_SELL_RSI_MAX: "45"
      SMARTFLOW_USE_RSI_GATE: "0"     # بوابة RSI معطّلة افتراضيًا (لقطة الشراء وقعت وRSI منخفض)
      SMARTFLOW_BREAK_LEN: "10"
      SMARTFLOW_ATR_LEN: "14"
      SMARTFLOW_SIGNAL_MODE: on_flip   # أول إشارة أو انقلاب — ضد إزعاج التكرار
      SMARTFLOW_ALTERNATE: "1"         # v1.2: تبادل إلزامي شراء↔بيع (معايَر من لقطة 2026-10-25)
      SMARTFLOW_COOLDOWN_BARS: "6"     # مهلة 6 شموع (تُستخدم فقط إذا عُطل التبادل)
      SMARTFLOW_BATCH_LIMIT: "8"       # حماية إغراق تيليجرام: إشارات أكثر من هذا في شمعة واحدة = رسالة مجمعة
      SMARTFLOW_EXCLUDE_NON_CRYPTO: "1"  # عملات رقمية فقط: استثناء الأسهم المرمزة/الذهب/المغلفات المكررة (قرار المالك)
      SMARTFLOW_BUYS_ONLY: "1"         # إرسال إشارات الشراء فقط — البيع/كسر الوقف يُسجل داخليًا بلا رسالة (قرار المالك)
      SMARTFLOW_CALIBRATION_NOTE: "1"  # سطر «نسخة قيد المعايرة» في كل رسالة (يُرفع إلى 0 بعد التثبيت)
      EXCLUDE_PEGGED_STABLES: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SmartFlow bot once
        run: python run_smartflow_once.py

      - name: Commit state updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update SmartFlow bot state [skip ci]"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                echo "State pushed on attempt $attempt"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Retry $attempt: another run updated the state first, retrying..."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push state after 5 attempts; next run will pick it up."
