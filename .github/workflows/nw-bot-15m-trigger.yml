name: NW 15M Bot — Trigger

# محفّز احتياطي موازٍ لمحفّز 1H: جدولة GitHub الأصلية قد تتأخر أو تتوقف،
# والمستودع لديه مُجدِّل خارجي يُطلق "Signal Bot Cron" كل 5 دقائق. نستمع
# لاكتماله عبر workflow_run ونُطلق nw-bot-15m.yml عبر API بـ GITHUB_TOKEN.
# أربع نوافذ قصيرة في الساعة (UTC دقيقة 00–04 / 15–19 / 30–34 / 45–49)
# ⇒ دورة واحدة بعد كل شمعة 15m. حالة النظام تمنع تكرار الرسائل أصلًا.
# لا يلمس هذا الملف nw-bot.yml ولا nw-bot-trigger.yml ولا أي إعداد لـ 1H.

on:
  workflow_run:
    workflows: ["Signal Bot Cron"]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: nw-15m-trigger
  cancel-in-progress: true

jobs:
  dispatch-nw-15m:
    if: vars.NW15_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Throttle and dispatch NW 15M bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          m=$(date -u +%M)
          m=$((10#$m))
          if { [ "$m" -ge 0 ] && [ "$m" -lt 5 ]; } || \
             { [ "$m" -ge 15 ] && [ "$m" -lt 20 ]; } || \
             { [ "$m" -ge 30 ] && [ "$m" -lt 35 ]; } || \
             { [ "$m" -ge 45 ] && [ "$m" -lt 50 ]; }; then
            code=$(curl -s -o /tmp/nw15_dispatch.json -w '%{http_code}' -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/nw-bot-15m.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "nw-bot-15m.yml dispatch → HTTP $code"
            if [ "$code" != "204" ]; then cat /tmp/nw15_dispatch.json; exit 1; fi
          else
            echo "خارج نافذة التشغيل (UTC دقيقة $m) — تخطٍّ بلا إرسال"
          fi
