name: Telegram Health Check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify bot token and chat without sending a message
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error,hashlib
          token=(os.environ.get('TG_TOKEN') or '').strip()
          chat=(os.environ.get('TG_CHAT') or '').strip()
          out={'token_present':bool(token),'chat_present':bool(chat)}
          out['chat_hash']=hashlib.sha256(chat.encode()).hexdigest()[:12] if chat else ''
          def call(method,params=None):
            url='https://api.telegram.org/bot'+token+'/'+method
            if params:url+='?'+urllib.parse.urlencode(params)
            try:
              with urllib.request.urlopen(url,timeout=15) as r:return json.load(r)
            except urllib.error.HTTPError as e:
              try:return json.load(e)
              except Exception:return {'ok':False,'description':'HTTP '+str(e.code)}
            except Exception as e:return {'ok':False,'description':str(e)[:160]}
          me=call('getMe') if token else {'ok':False}
          out['bot_ok']=bool(me.get('ok'))
          out['bot_username']=(me.get('result') or {}).get('username','')
          out['bot_id']=(me.get('result') or {}).get('id','')
          gc=call('getChat',{'chat_id':chat}) if (token and chat) else {'ok':False}
          out['chat_ok']=bool(gc.get('ok'))
          out['chat_type']=(gc.get('result') or {}).get('type','')
          out['chat_error']=gc.get('description','') if not gc.get('ok') else ''
          print('HEALTH_JSON='+json.dumps(out,ensure_ascii=False,separators=(',',':')))
          PY
