name: Signal Bot Cron

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-bot-cron
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIMEZONE: Asia/Riyadh
      BINANCE_BASE_URL: https://data-api.binance.vision
      BINANCE_QUOTE_ASSET: USDT
      BINANCE_INTERVAL: 1h
      POLL_SECONDS: 60
      # 499 = أقصى حد يبقى فيه وزن طلب Binance لـ klines = 2، وهو مطلوب لأن
      # sma(atr(200),200) في Target Trend لا تصحح قبل ~400 شمعة.
      KLINE_LIMIT: 499
      REQUEST_TIMEOUT: 20
      MAX_WORKERS: 10
      HALAL_REFRESH_HOURS: 6
      STATE_FILE: data/state.json
      LOG_LEVEL: INFO
      # ── المؤشر المعتمد الوحيد: Target Trend [BigBeluga] (فريم 1H، سبوت/USDT) ──
      TREND_LENGTH: 10        # طول الاتجاه (Trend Length في Pine)
      TREND_TARGET_OFFSET: 0  # Set Targets في Pine (0 = أهداف 5/10/15×ATR)
      # استثناء أزواج العملات المستقرة المربوطة (هدف ATR عليها ضجيج) — الإيقاف: "0"
      EXCLUDE_PEGGED_STABLES: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot once
        run: python run_once.py

      - name: Commit state updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add data/ : يضيف كل ملفات الحالة الموجودة (وتتجاهل غير الموجود مثل دفتر الظلّي قبل أول إشارة)
          git add data/
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update bot state [skip ci]"

          # تشغيلان متزامنان قد يتصادمان على data/state.json. عند التعارض نُبقي
          # نسختنا (الأحدث) عبر -X theirs داخل الـrebase، مع إعادة محاولة 3 مرات.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                echo "State pushed on attempt $attempt"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Retry $attempt: another run updated the state first, retrying..."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push state after 5 attempts; next run will pick it up."
