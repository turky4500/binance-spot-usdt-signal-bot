name: Signal Bot Cron

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal-bot-cron
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TIMEZONE: Asia/Riyadh
      BINANCE_BASE_URL: https://data-api.binance.vision
      BINANCE_QUOTE_ASSET: USDT
      BINANCE_INTERVAL: 1h
      POLL_SECONDS: 60
      KLINE_LIMIT: 260
      REQUEST_TIMEOUT: 20
      MAX_WORKERS: 10
      HALAL_REFRESH_HOURS: 6
      STATE_FILE: data/state.json
      LOG_LEVEL: INFO
      # بوابات جودة الدخول (يمكن تعديلها من هنا بدون تعديل الكود)
      GATE_MIN_REL_VOLUME: 1.2
      GATE_MAX_REL_VOLUME: 2.5
      GATE_REQUIRE_DI_POSITIVE: "true"
      GATE_MIN_DI_SPREAD: 0.0
      # الدخول الذكي: تصنيف الساعة في كل رسالة + (اختياريًا) بوابة زمنية أو سقف صفقات
      SMART_ENTRY: "0"
      # قرار المستخدم: تشغيل 24 ساعة وبلا سقف للصفقات — لا يريد تفويت أي إشارة
      # القياس يقول: ساعات 00–06 أفضل (+0.135%/صفقة، t=+7.64) وساعات 07–23 أسوأ (−0.163%)،
      # لكن الحافة كلها في ساعات النوم، فالتشغيل 24 ساعة يحل مشكلة تفويت الإشارات.
      ENTRY_HOURS: ""
      MAX_OPEN_TRADES: "0"
      # الوضع الظلّي: تسجيل نظام «ارتداد الاتجاه اليومي» بلا رسائل (لقياس الجودة الحيّة)
      STRATEGY_SHADOW: "1"
      # وضع الهدوء (قرار المستخدم 2026-10-08): إسكات رسائل الدخول للنظام القديم (سالب التوقع حيًّا:
      # −0.57%/صفقة على 169 صفقة) مع بقاء التسجيل والمتابعة والتقارير. الأهداف/الأوقاف تُرسل كالمعتاد.
      QUIET_ENTRY_SIGNALS: "1"
      # لتفعيل الفلترة لاحقًا: SMART_ENTRY="1" و ENTRY_HOURS="0,2,5,6,14,21,23"
      # ولتحديد سقف للصفقات: MAX_OPEN_TRADES="15" (0 = بلا حد)
      # قاعدة الخروج: hybrid | trailing | fixed_target
      # hybrid = وقف الإشارة الأصلي حتى +2%، ثم وقف متحرك 2×ATR بأرضية التعادل
      EXIT_MODE: hybrid
      TRAIL_ATR_MULT: 2.0
      TRAIL_ATR_LEN: 14
      REFERENCE_TARGET_PCT: 2.0
      HYBRID_LOCK_PCT: 0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot once
        run: python run_once.py

      - name: Commit state updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # git add data/ : يضيف كل ملفات الحالة الموجودة (وتتجاهل غير الموجود مثل دفتر الظلّي قبل أول إشارة)
          git add data/
          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi
          git commit -m "chore: update bot state [skip ci]"

          # تشغيلان متزامنان قد يتصادمان على data/state.json. عند التعارض نُبقي
          # نسختنا (الأحدث) عبر -X theirs داخل الـrebase، مع إعادة محاولة 3 مرات.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                echo "State pushed on attempt $attempt"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Retry $attempt: another run updated the state first, retrying..."
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push state after 5 attempts; next run will pick it up."
