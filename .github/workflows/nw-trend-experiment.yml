name: NW Trend Experiment 1H (All USDT)

# تجربة مستقلة وموازية — لا تلمس النظام السادس (NW 1H) ولا أي نظام آخر.
# الحالة والدفتر والرسائل محصورة في data/nw_trend/* فقط.
#
# القاعدة: EMA200 + ميل صاعد + اختراق قمة 20 شمعة ⇒ دخول؛
#          وقف 2.5×ATR(14) ثم تتبّع قاع 10 شموع ⇒ خروج. بلا هدف ربح ثابت.
# الفريم: 1H | الكون: كل أزواج USDT الفورية عدا المستقرة المربوطة.
#
# الجدولة: cron '3 * * * *' UTC = كل ساعة :03 بتوقيت الرياض (UTC+3).
#          تُقيَّم الشمعة المغلقة للتو، وإن فاتت ساعة يعالج الكود حتى 6 شموع فائتة.
# بقرار المستخدم 2026-11-16: بلا إيقاف تلقائي.
# الإيقاف: Disable workflow، أو اضبط المتغيّر NW_TREND_ENABLED = false.
# الحماية if على مستوى المهمة — لا تُستخدم خطوة exit 0 كبوابة إطلاقًا.

on:
  schedule:
    - cron: '3 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nw-trend-experiment
  cancel-in-progress: false

jobs:
  run-once:
    if: vars.NW_TREND_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # رسائل فعلية فورية (قرار المستخدم). للإسكات مع استمرار العمل: "1".
      TELEGRAM_MUTE: "0"
      TELEGRAM_MIN_INTERVAL_SECONDS: "1.05"
      TIMEZONE: Asia/Riyadh
      BINANCE_BASE_URL: https://data-api.binance.vision
      REQUEST_TIMEOUT: "20"
      MAX_WORKERS: "10"
      LOG_LEVEL: INFO
      NW_TREND_STATE_FILE: data/nw_trend/state.json
      NW_TREND_TRADE_LOG: data/nw_trend/trades.csv
      NW_TREND_MESSAGE_LOG: data/nw_trend/messages.jsonl
      NW_TREND_REPORT_DIR: data/nw_trend/reports
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh checkout to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one 1H cycle on all USDT pairs
        run: |
          for attempt in 1 2 3; do
            if python tools/nw_trend_run.py; then
              exit 0
            fi
            echo "⟳ محاولة $attempt فشلت؛ إعادة بعد $((attempt * 5)) ثانية"
            sleep $((attempt * 5))
          done
          echo "::error::فشلت دورة تجربة TREND بعد 3 محاولات"
          exit 1

      - name: Commit experiment state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nw_trend/
          if git diff --cached --quiet; then
            echo "No experiment state changes to commit"
            exit 0
          fi
          git commit -m "chore(nw-trend): 1h state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Experiment state pushed on attempt $attempt"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Retry $attempt: another run updated main first"
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push experiment state after 5 attempts; next run will catch up."
