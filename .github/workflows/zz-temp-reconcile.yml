name: Temp Telegram Reconcile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recent Bot API updates
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,datetime
          t=os.environ['TG_TOKEN']
          u=f'https://api.telegram.org/bot{t}/getUpdates?limit=100&offset=-100'
          try:
              with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'reconcile'}),timeout=20) as r:
                  d=json.load(r)
          except Exception as e:
              print('FETCH_ERROR',type(e).__name__);raise SystemExit(1)
          print('ok',d.get('ok'),'count',len(d.get('result',[])))
          cutoff=datetime.datetime(2026,11,9,15,50,tzinfo=datetime.timezone.utc)
          for x in d.get('result',[]):
              m=x.get('message') or x.get('channel_post') or x.get('edited_message') or {}
              ts=datetime.datetime.fromtimestamp(m.get('date',0),datetime.timezone.utc)
              if ts<cutoff:continue
              print('MSG',ts.strftime('%Y-%m-%dT%H:%M:%SZ'),json.dumps(m.get('text',''),ensure_ascii=False))
          PY
