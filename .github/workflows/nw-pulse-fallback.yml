name: NW Pulse Fallback

# نبض احتياطي داخلي (2026-11-10)، مأخوذ من فكرة العمل في
# turky4500/crypto-signals-arabic: مُنبّه خارجي + كرون GitHub + حاجز
# «تشغيل نشط / آخر تشغيل حديث» يمنع الازدواج.
#
# Signal Bot Cron لا يملك schedule؛ يُطلقه حاليًا ممثّل خارجي كل ~5 دقائق.
# هذا الوركفلو يعمل على كرون GitHub كل 5 دقائق، ولا يرسل workflow_dispatch
# إلا إذا كان آخر نبض أقدم من 4 دقائق ولا يوجد نبض نشط. إن كان المنبّه
# الخارجي يعمل ⇒ يتخطّى دائمًا. لا يرسل أي رسالة تلغرام، ولا يلمس الحالة
# أو الدفاتر أو شروط الإشارة، ولا يُعيد تفعيل 15M أو التريغر القديم.
# يستخدم GITHUB_TOKEN فقط؛ لا PAT ولا أسرار Telegram في الملف.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'اختبر الإرسال مرة واحدة حتى لو كان النبض حديثًا للتحقق فقط'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: nw-pulse-fallback
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch heartbeat only when stale
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          force = str(os.environ.get("FORCE", "false")).lower() == "true"
          H = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nw-pulse-fallback",
              "Content-Type": "application/json",
          }
          base = f"https://api.github.com/repos/{repo}"

          def get(url):
              req = urllib.request.Request(url, headers=H)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          runs = get(base + "/actions/workflows/signal-bot-cron.yml/runs?per_page=10")["workflow_runs"]
          ACTIVE = ("queued", "in_progress", "pending", "waiting", "requested")
          active = [r for r in runs if r.get("status") in ACTIVE]

          def started_ms(run):
              raw = run.get("run_started_at") or run.get("created_at") or ""
              try:
                  return datetime.datetime.fromisoformat(raw.replace("Z", "+00:00")).timestamp() * 1000
              except Exception:
                  return 0

          last = max((started_ms(r) for r in runs), default=0)
          now_ms = datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000
          age_s = (now_ms - last) / 1000 if last else 10**9
          print("active_runs", len(active), "last_pulse_age_seconds", round(age_s, 1), "force", force)

          if active and not force:
              print("⏭ يوجد نبض نشط — تخطٍّ بدون إرسال")
              raise SystemExit(0)
          if age_s < 240 and not force:
              print(f"⏭ آخر نبض منذ {age_s:.0f} ثانية (<240) — تخطٍّ بدون إرسال")
              raise SystemExit(0)

          req = urllib.request.Request(
              base + "/actions/workflows/signal-bot-cron.yml/dispatches",
              data=b'{"ref":"main"}',
              method="POST",
              headers=H,
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("✅ نبض احتياطي أُرسل HTTP", r.status)
          except urllib.error.HTTPError as exc:
              print("::error::فشل إرسال النبض", exc.code, exc.read().decode()[:300])
              raise
          PY
