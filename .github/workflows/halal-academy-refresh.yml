name: Halal Academy Refresh

# تحديث ملف أحكام أكاديمية البيتكوين كل 6 ساعات (2026-11-11).
# • يذهب للموقع: جدول الـ77 صفحة + مقالات التصنيف 3181 عبر REST.
# • يدمج فقط: يعدّل ما تغيّر، ويضيف العملات الجديدة/التي صار لها حكم،
#   ولا يحذف أي رمز موجود غاب عن الموقع.
# • يكتب ملفين فقط: halal_academy.json و halal_academy_meta.json.
# • GITHUB_TOKEN فقط، بلا PAT ولا Telegram ولا أي سر آخر؛ لا push trigger.
# • [skip ci] في رسالة الكومِت + concurrency ⇒ لا تكرار ولا تشغيل للبوتات.

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halal-academy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: python -m pip install --quiet 'requests>=2.31.0'

      - name: Fetch site rulings and merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/update_halal_academy.py
