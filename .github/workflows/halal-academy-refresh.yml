name: Halal Academy Refresh

# تحديث ملف أحكام أكاديمية البيتكوين كل 30 دقيقة.
# • يذهب للموقع: جدول الدليل ومقالات التصنيف 3181 عبر REST.
# • يدمج فقط: يعدّل ما تغيّر، ويضيف العملات الجديدة/التي صار لها حكم،
#   ولا يحذف أي رمز موجود غاب عن الموقع.
# • يكتب ملفين فقط: halal_academy.json و halal_academy_meta.json.
# • GITHUB_TOKEN فقط، بلا PAT ولا Telegram ولا أي سر آخر؛ لا push trigger.
# • نبض Signal Bot Cron احتياطي إن تأخرت جدولة GitHub؛ بوابة حداثة تمنع
#   إعادة جلب الموقع إذا كان آخر فحص سليم منذ أقل من 30 دقيقة.
# • الإطلاق اليدوي يتجاوز البوابة؛ concurrency يمنع تحديثين في آن واحد.
# • [skip ci] في رسالة الكومِت ⇒ لا تشغيل للبوتات بسبب تحديث الأحكام.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["Signal Bot Cron"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: halal-academy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether a refresh is due
        id: due
        run: python tools/halal_refresh_gate.py

      - name: Install requests
        if: steps.due.outputs.refresh == 'true'
        run: python -m pip install --quiet 'requests>=2.31.0'

      - name: Fetch site rulings and merge
        if: steps.due.outputs.refresh == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/update_halal_academy.py
