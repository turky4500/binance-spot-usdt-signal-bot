name: Halal Academy Refresh

# تحديث ملف أحكام أكاديمية البيتكوين كل 30 دقيقة.
# • يذهب للموقع: جدول الدليل ومقالات التصنيف 3181 عبر REST.
# • يدمج فقط: يعدّل ما تغيّر، ويضيف العملات الجديدة/التي صار لها حكم،
#   ولا يحذف أي رمز موجود غاب عن الموقع.
# • محدّث الأحكام يكتب halal_academy.json و halal_academy_meta.json فقط.
# • تقرير منتصف الليل يستخدم أسرار Telegram الموجودة، ويحفظ حالة مستقلة
#   في halal_academy_report_state.json دون تعديل الإشارات أو المراكز.
# • نبض Signal Bot Cron احتياطي إن تأخرت جدولة GitHub؛ بوابة حداثة تمنع
#   إعادة جلب الموقع إذا كان آخر فحص سليم منذ أقل من 30 دقيقة.
# • الإطلاق اليدوي يتجاوز البوابة؛ concurrency يمنع تحديثين في آن واحد.
# • [skip ci] في رسالة الكومِت ⇒ لا تشغيل للبوتات بسبب تحديث الأحكام.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["Signal Bot Cron"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      report_bootstrap_only:
        description: 'تهيئة نسخة المقارنة للتقرير فقط، دون جلب أو رسالة'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: halal-academy-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check whether a refresh is due
        id: due
        run: python tools/halal_refresh_gate.py

      - name: Install requests
        if: ${{ steps.due.outputs.refresh == 'true' && inputs.report_bootstrap_only != true }}
        run: python -m pip install --quiet 'requests>=2.31.0'

      - name: Fetch site rulings and merge
        if: ${{ steps.due.outputs.refresh == 'true' && inputs.report_bootstrap_only != true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python tools/update_halal_academy.py

      - name: Send daily Academy file report if due
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.setup_python.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_BOOTSTRAP_ONLY: ${{ inputs.report_bootstrap_only }}
        run: python tools/halal_daily_report.py
