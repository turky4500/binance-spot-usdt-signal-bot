name: ZigZag Fast Watcher (كل دقيقة)

# لماذا هذا الملف؟ جدولة GitHub cron غير منتظمة (قياس فعلي: 2–66 دقيقة بين تشغيل وآخر)،
# فتتأخر رسالة «لمس الهدف» 18–37 دقيقة رغم أن الكود يفحص شموع الدقيقة ويرسل عند اللمس.
# هذا الـ workflow يشغّل البوت في حلقة داخل مهمة واحدة كل ~60 ثانية ⇒ تأخير ≈ دقيقة.
# يعمل 5 ساعات لكل تشغيل، ثم **يعيد تشغيل نفسه تلقائيًا** ⇒ مراقبة 24/7 بلا تدخل.
# إيقافه نهائيًا: Actions → هذا الـ workflow → Disable workflow (أو اجعل المتغير
# WATCHER_ENABLED = false في Settings → Variables).
# المستودع public ⇒ دقائق Actions مجانية.
on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'مدة المراقبة بالساعات (1-5)'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: zigzag-signal-bot-cron   # نفس مجموعة الكرون ⇒ لا تصادم على ملف الحالة
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # ZigZag هو النظام الوحيد النشط رسائليًا الآن (بقية الأنظمة مُسكتة).
      TELEGRAM_MUTE: "0"
      TIMEZONE: Asia/Riyadh
      BINANCE_BASE_URL: https://data-api.binance.vision
      BINANCE_QUOTE_ASSET: USDT
      POLL_SECONDS: 60
      # 300 شمعة ساعة تكفي Depth=12 مع هامش كبير — وزن الطلب = 2
      KLINE_LIMIT: 300
      REQUEST_TIMEOUT: 20
      MAX_WORKERS: 10
      HALAL_REFRESH_HOURS: 6
      LOG_LEVEL: INFO
      # ── نظام ZigZag++ (ساعة) — مسارات مستقلة ──
      ZZ_STATE_FILE: data/state_zigzag.json
      ZZ_HALAL_DIR: data/zigzag
      # ── قواعد النظام ──
      ZZ_DEPTH: 12                  # عمق ZigZag (Depth)
      # قاعدة المستخدم (2026-10-30): إشارة القاع ZigZag++ [LD] ⇒ الشمعة التالية خضراء ⇒
      # الدخول بإغلاقها، وإن كانت حمراء/دوجي تُلغى الإشارة. (low12 = القاعدة القديمة)
      ZZ_BOTTOM_MODE: "zigzag_ld"
      ZZ_PIVOT_SOURCE: "live"       # live = الوسم لحظة ظهوره (قاعدة المستخدم) | confirmed = بعد backstep
      ZZ_BOTTOM_BAR: "extreme"      # extreme = شمعة أدنى سعر (موضع الوسم) | detect = شمعة الاكتشاف
      ZZ_DEVIATION: "5"
      ZZ_BACKSTEP: "2"
      ZZ_MAX_STOP_PCT: "2.5"        # ارفض الإشارة إذا كان القاع أبعد من 2.5% (وقف مكلف)
      ZZ_TARGET_R: "1.5"            # الهدف = الدخول + 1.5 × (الدخول − القاع)
      ZZ_TARGET_PCT: "2"            # الهدف +2% من سعر الدخول (لمس)
      ZZ_DOJI_BODY_PCT: "0.05"      # الدوجي: جسم ≤ 0.05% من السعر
      ZZ_LOOKBACK_BARS: 6           # أقصى عمر للقاع عند البحث
      ZZ_MAX_ENTRY_AGE_HOURS: "2"   # رفض الإشارات الأقدم من ساعتين (توقف/بيانات قديمة)
      ZZ_COMMISSION_SIDE_PCT: "0.1" # العمولة لكل جهة % (للدفتر فقط)
      # فلتر اختياري: أدنى مسافة بين الدخول وقاع الإشارة %. 0 = معطّل (المعتمد حاليًا)
      ZZ_MIN_STOP_PCT: "0"
      # ── فلتر المتوسط 200 (2026-10-30): لا إشارة إلا فوق EMA200 ──
      # السبب: 246 إشارة في ثانية واحدة عند هبوط سوقي عام ثم 141 خسارة معًا.
      ZZ_EMA_FILTER: "1"
      ZZ_EMA_LEN: "200"
      # قائمة استبعاد (أسهم/ETF مرمّزة، ذهب مرمّز) — الملف داخل المستودع
      ZZ_EXCLUDE_FILE: config/zz_exclude.txt
      # استبعاد آلي للأسهم/الصناديق المرمّزة (قاعدة تنتهي بـ B)
      ZZ_EXCLUDE_B_SUFFIX: "1"
      # ── رسائل فردية (2026-10-30): رسالة مستقلة لكل عملة، بلا تجميع ──
      # التوقيت فعلي: الإرسال في نفس الدورة (45–60 ثانية) بلا انتظار إغلاق شمعة.
      TELEGRAM_MIN_INTERVAL_SECONDS: "1.05"
      # حماية من التقرير اليومي المكرّر بين المراقب والكرون (2026-10-30)
      ZZ_STATE_URL: "https://raw.githubusercontent.com/turky4500/binance-spot-usdt-signal-bot/main/data/state_zigzag.json"
      # استثناء أزواج العملات المستقرة المربوطة — الإيقاف: "0"
      EXCLUDE_PEGGED_STABLES: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Watch loop (كل ~60 ثانية)
        env:
          HOURS: ${{ github.event.inputs.hours || '5' }}
          WATCHER_ENABLED: ${{ vars.WATCHER_ENABLED || 'true' }}
        run: |
          set +e
          if [ "${WATCHER_ENABLED:-true}" = "false" ]; then
            echo "⏹ المراقب معطّل عبر المتغير WATCHER_ENABLED=false — إنهاء بلا إعادة تشغيل."
            exit 0
          fi

          # بصمة الحالة: تتغيّر عند أي إشارة/إغلاق ⇒ نحفظها فورًا (يمنع تكرار الرسائل)
          sig() {
            python -c "import json,hashlib;d=json.load(open('data/state_zigzag.json'));k=json.dumps([sorted(d.get('open_signals',{})),len(d.get('event_log',[])),len(d.get('sent_msgs',[]))]);h=hashlib.md5(open('data/trades_log_zigzag.csv','rb').read()).hexdigest();print(hashlib.md5((k+h).encode()).hexdigest())"
          }

          push_state() {
            git add data/ || true
            git diff --cached --quiet && return 0
            git commit -q -m "chore: update ZigZag bot state [skip ci]" || true
            for attempt in 1 2 3; do
              git fetch -q origin main
              if git rebase -X theirs origin/main 2>/dev/null && git push -q origin HEAD:main; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 3))
            done
            echo "::warning::تعذّر حفظ الحالة (محاولة $n)"
          }

          END=$(( $(date +%s) + HOURS * 3600 - 120 ))
          n=0
          while [ "$(date +%s)" -lt "$END" ]; do
            n=$((n+1))
            echo "── دورة $n — $(TZ=Asia/Riyadh date '+%H:%M:%S') ──"
            before=$(sig)
            python run_zigzag_once.py || echo "::warning::فشلت الدورة $n (سنتابع)"
            after=$(sig)
            if [ "$before" != "$after" ]; then
              echo "🔔 تغيّرت الإشارات ⇒ حفظ فوري للحالة (منع تكرار الرسائل)"
              push_state
            elif [ $((n % 5)) -eq 0 ]; then
              push_state
            fi
            sleep 45
          done
          push_state
          echo "انتهت المراقبة بعد $n دورة — يجري تشغيل الدورة التالية تلقائيًا."

      - name: Chain next watcher run (24/7)
        if: ${{ always() && vars.WATCHER_ENABLED != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # workflow_dispatch مُستثنى من قاعدة «أحداث GITHUB_TOKEN لا تُشغّل workflows»
          for attempt in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/chain.out -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/workflows/zigzag-watch-loop.yml/dispatches" \
              -d '{"ref":"main"}')
            echo "chain dispatch HTTP $CODE (محاولة $attempt)"
            [ "$CODE" = "204" ] && exit 0
            sleep $((attempt * 10))
          done
          echo "::warning::تعذّر جدولة التشغيل التالي — شغّل المراقب يدويًا."
          cat /tmp/chain.out || true
