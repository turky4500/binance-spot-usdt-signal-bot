name: NW 4H Bot — Guarded Kick

# تأمين جدولة فريم 4H (2026-11-09): جدولة GitHub native '3 0,4,8,12,16,20'
# فاتت دورات 12:03Z و16:03Z، والتقرير اليومي لم يُرسل أصلًا. طلب المستخدم:
# «اجعل فريم 4 ساعات يعمل لا يحتاج أن اقول لك في كل مرة... أجلس وانتظر
# الرسائل والنظام يعمل». هذا المُشغّل:
#   • يستمع لاكتمال "Signal Bot Cron" (نبض موثوق كل ~5 دقائق) + جدولة احتياطية.
#   • دورات الإشارات: نوافذ UTC 00/04/08/12/16/20 (:03–:19) ⇒ 6 دورات/يوم.
#   • التقرير اليومي: نافذة 21:00–21:19 UTC = 12:00–12:19 AM الرياض.
#   • يرفض الإطلاق إن وُجد تشغيل نشط، أو دورة ناجحة داخل شمعة 4h الحالية،
#     أو كان تقرير اليوم قد أُرسل بالفعل (last_report_day) ⇒ لا تكرار.
#   • يرسل {"ref":"main"} فقط؛ nw-bot-4h.yml نفسه يحدّث checkout إلى أحدث
#     main ويمنع التشغيل المتزامن ⇒ لا حالة قديمة ولا رسائل مكرّرة.
# لا يمسّ 1H ولا 15M، ولا يُعيد تفعيل أي تريغر قديم، ويستخدم GITHUB_TOKEN فقط.

on:
  workflow_run:
    workflows: ["Signal Bot Cron"]
    types: [completed]
  schedule:
    - cron: '3,8,13,18 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: nw-4h-guard
  cancel-in-progress: false

jobs:
  kick:
    # البوابة الوحيدة هي متغيّر التفعيل؛ كل قرار النافذة/التكرار داخل السكربت.
    # هذا يتجنّب ضياع نبضة workflow_run إن انتهى النبض بـ skipped/cancelled.
    if: vars.NW4H_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Guarded dispatch of NW 4H bot / daily report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, base64, urllib.request, urllib.error, datetime
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          H = {"Authorization": f"Bearer {token}",
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28",
               "User-Agent": "nw-4h-guard"}
          base = f"https://api.github.com/repos/{repo}"
          now = datetime.datetime.now(datetime.timezone.utc)
          h, m = now.hour, now.minute
          riyadh = datetime.timezone(datetime.timedelta(hours=3))
          expected = (now.astimezone(riyadh).date() - datetime.timedelta(days=1)).isoformat()

          def get(path, raw=False):
              headers = {**H, "Accept": "application/vnd.github.raw+json"} if raw else H
              req = urllib.request.Request(base + path, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  body = r.read()
              return body if raw else json.loads(body)

          def runs_of(wf):
              return get(f"/actions/workflows/{wf}/runs?per_page=20")["workflow_runs"]

          def dispatch(wf):
              print("🚀 إطلاق", wf, "على main")
              data = b'{"ref":"main"}'
              req = urllib.request.Request(base + f"/actions/workflows/{wf}/dispatches",
                                           data=data, method="POST",
                                           headers={**H, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      print("dispatch HTTP", r.status)
              except urllib.error.HTTPError as e:
                  print("::error::فشل الإرسال", e.code, e.read().decode()[:300])
                  raise SystemExit(1)

          ACTIVE = ("queued", "in_progress", "pending", "waiting", "requested")
          clock = now.strftime("%Y-%m-%d %H:%M UTC")

          # ── نافذة دورات الإشارات: بعد إغلاق شمعة 4h بثلاث دقائق وحتى :19 ──
          bot_window = (h % 4 == 0) and 3 <= m < 20
          # ── نافذة التقرير اليومي: 12:00–12:19 AM الرياض = 21:00–21:19 UTC ──
          report_window = (h == 21) and m < 20
          if not bot_window and not report_window:
              print(f"⏭ خارج نوافذ 4H ({clock}) — تخطٍّ")
              raise SystemExit(0)

          if bot_window:
              try:
                  runs = runs_of("nw-bot-4h.yml")
              except Exception as e:
                  print("::error::تعذّر قراءة تشغيلات 4H:", e)
                  raise SystemExit(1)
              active = [r for r in runs if r.get("status") in ACTIVE]
              if active:
                  print("⏭ يوجد تشغيل 4H نشط:", [(r["id"], r["status"]) for r in active])
                  raise SystemExit(0)
              # **دورة ناجحة واحدة لكل شمعة 4h**: فاشل لا يُفوّت النافذة،
              # وتشغيل يدوي في نافذة سابقة لا يؤثر على النافذة التالية.
              window_start = now.replace(hour=(h // 4) * 4, minute=0, second=0, microsecond=0)
              ok = [r for r in runs
                    if r.get("status") == "completed"
                    and r.get("conclusion") == "success"
                    and datetime.datetime.fromisoformat(
                        r["created_at"].replace("Z", "+00:00")) >= window_start]
              if ok:
                  print("⏭ توجد دورة 4H ناجحة داخل شمعة هذه النافذة:", [r["id"] for r in ok])
                  raise SystemExit(0)
              dispatch("nw-bot-4h.yml")
              raise SystemExit(0)

          # ── التقرير اليومي ──────────────────────────────────────────────
          try:
              body = get("/contents/data/state_nw4h.json?ref=main", raw=True)
              try:
                  state = json.loads(body)
              except Exception:
                  state = {}
              if isinstance(state, dict) and "content" in state:
                  state = json.loads(base64.b64decode(state["content"]))
          except Exception as e:
              print("::warning::تعذّر قراءة حالة 4H — تخطٍّ آمن لهذه النبضة:", e)
              raise SystemExit(0)
          report_state = (state.get("daily_report_nw4h") or {}) if isinstance(state, dict) else {}
          if report_state.get("last_report_day") == expected:
              print("⏭ تقرير 4H أُرسل بالفعل لليوم", expected, "— تخطٍّ")
              raise SystemExit(0)
          try:
              runs = runs_of("nw-bot-4h-report.yml")
          except Exception as e:
              print("::error::تعذّر قراءة تشغيلات التقرير:", e)
              raise SystemExit(1)
          active = [r for r in runs if r.get("status") in ACTIVE]
          if active:
              print("⏭ يوجد تشغيل تقرير نشط:", [(r["id"], r["status"]) for r in active])
              raise SystemExit(0)
          # إصلاح 2026-11-10: تشغيل schedule قد يصل متأخرًا خارج نافذة 12 AM،
          # فينجح بلا إرسال ويترك last_report_day قديمًا. لا يمنع هذا التشغيلُ
          # تقريرَ اليوم؛ الحاجز الحقيقي هو last_report_day أعلاه، مع فاصل
          # 5 دقائق فقط بين محاولات dispatch لمنع التكرار «لا حظر 20 ساعة».
          if runs:
              last = max(datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
                         for r in runs)
              age_min = (now - last).total_seconds() / 60
              if age_min < 5:
                  print(f"⏭ آخر محاولة تقرير منذ {age_min:.1f} دقيقة (<5) — تخطٍّ مؤقت")
                  raise SystemExit(0)
          dispatch("nw-bot-4h-report.yml")
          PY
