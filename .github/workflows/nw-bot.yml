name: NW 1H Bot (Nadaraya-Watson)

# النظام السادس — مستقل تمامًا: حالة ودفتر ووركفلو خاص به فقط.
# المصدر: Nadaraya-Watson Smoothers [LuxAlgo] (CC BY-NC-SA 4.0)، فريم الساعة.
# القاعدة (بعد إلغاء شرط الخط 2026-11-06): ▲ + شمعة تالية خضراء ⇒ توصية دخول،
#          ▼ ⇒ إشارة خروج، وتكرار ▲ ⇒ «إشارة دخول ثانية». بلا أهداف ولا وقف.
#          لون خط المؤشر **ليس شرطًا** ولا يُذكر في الرسائل.
# منذ 2026-11-06 يعمل على «Nadaraya-Watson Envelope [LuxAlgo]» الذي أرسله
#          المستخدم: التسميات ▲/▼ تُقرأ كما يطبعها الكود على الشارت بالحرف
#          (Repainting Mode Enabled)، ثم يُطبّق شرط «الشمعة التالية خضراء».
# الدخول من المؤشر وحده: لا بوابة BTC. الإرسال يشمل كل أزواج USDT الفورية
# بجميع أحكامها (الحكم يُعرض في الرسالة ولا يُستخدم كفلتر).
#
# ⚠️ الإيقاف الصحيح: اضبط المتغيّر NW_ENABLED = false (أو Disable workflow).
#    الحماية if على مستوى المهمة — لا تُستخدم خطوة `exit 0` كبوابة إطلاقًا
#    (الدرس الموثّق في handoff.md §5).
#
# إصلاح 2026-11-09: جدولة GitHub الأصلية ('5,35') قد تتوقف ساعات، فأضفنا
# مُشغّلًا محميًا (nw-bot-1h-guard.yml) يعتمد على نبض Signal Bot Cron.
# حاجز «التشغيل الفردي» أدناه + تحديث checkout إلى أحدث main قبل قراءة
# الحالة يمنعان تكرار حادثة 07:02/07:03 (حالتان قديمتان أُرسلتا مرتين).
# الجدولتان الأصليتان تبقيان كنسخة احتياطية فقط.

on:
  schedule:
    - cron: '5 * * * *'
    - cron: '35 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nw-1h-bot
  cancel-in-progress: false

jobs:
  run-once:
    if: vars.NW_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # تفعيل فوري برسائل حقيقية (قرار المستخدم 2026-11-06).
      # للإسكات المؤقت مع استمرار العمل: اضبطها "1".
      TELEGRAM_MUTE: "0"
      TELEGRAM_MIN_INTERVAL_SECONDS: "1.05"
      TIMEZONE: Asia/Riyadh
      BINANCE_BASE_URL: https://data-api.binance.vision
      BINANCE_QUOTE_ASSET: USDT
      REQUEST_TIMEOUT: "20"
      MAX_WORKERS: "10"
      LOG_LEVEL: INFO
      # ── مسارات النظام (معزولة — لا يلمس أي ملف لأنظمة أخرى) ──
      NW_STATE_FILE: data/state_nw.json
      NW_TRADE_LOG: data/trades_log_nw.csv
      NW_HALAL_PRIMARY: data/daily_trend/halal_academy.json
      NW_HALAL_EXTRA: data/daily_trend/halal_extra.json
      NW_HALAL_CACHE: data/zigzag/halal_verdicts.json
      NW_EXCLUDE_FILE: config/zz_exclude.txt
      # ── ثوابت المؤشر ──
      NW_BANDWIDTH: "8"
      NW_WINDOW: "500"
      # مصدر الإشارة الوحيد: Nadaraya-Watson Envelope [LuxAlgo] كما أرسله
      # المستخدم — h=8, mult=3, src=close, نافذة 500, Repainting Mode Enabled.
      # لا يوجد أي مقدّر بديل أو تصحيح حافة أو عتبة ضجيج أو شرط لون خط.
      NW_MODE: "envelope"
      NW_MULT: "3"
      NW_KLINE_LIMIT: "560"   # ≥502 شمعة مغلقة: نافذة 500 + src[i+1] + لقطة المقارنة
      NW_REQUIRE_NEWEST_GREEN: "0" # لون الخط ليس شرطًا (قرار المستخدم)
      NW_COMMISSION_SIDE_PCT: "0.1"
      NW_SHOW_REPAINT_WARNING: "0"     # القالب المبسّط بلا سطر تحذير؛ 1 يعيده
      # ── كل العملات بجميع أحكامها (قرار المستخدم 2026-11-06) ──
      NW_INCLUDE_ALL: "1"                  # لا فلتر شرعي؛ 0 = المباح فقط (السلوك القديم)
      NW_EXCLUDE_PEGGED_STABLES: "1"      # استثناء العملات المستقرة المربوطة (ضجيج، ليست عملات متقلبة)
      NW_EXCLUDE_TOKENIZED_STOCKS: "0"    # 1 = استثناء الأسهم المرمّزة
      NW_USE_EXCLUDE_FILE: "0"            # 1 = تفعيل config/zz_exclude.txt
    steps:
      - name: Guard against concurrent 1H runs
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          me = int(os.environ["RUN_ID"])
          H = {"Authorization": f"Bearer {token}",
               "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28",
               "User-Agent": "nw-1h-singleton"}
          url = f"https://api.github.com/repos/{repo}/actions/workflows/nw-bot.yml/runs?per_page=30"
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=20) as r:
                  runs = json.load(r)["workflow_runs"]
          except Exception as e:
              print("::error::تعذّر فحص التشغيلات النشطة:", e)
              raise SystemExit(1)
          active = [r for r in runs
                    if r["id"] != me
                    and r.get("status") in ("queued", "in_progress", "pending", "waiting", "requested")]
          older = [r for r in active if r["id"] < me]
          proceed = "false" if older else "true"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"proceed={proceed}\n")
          if older:
              print("⏭ تشغيل أقدم ما زال نشطًا — انسحاب لمنع التكرار:", [r["id"] for r in older])
          else:
              print("✅ لا يوجد تشغيل أقدم نشط — متابعة الدورة")
          PY

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh checkout to latest main (prevent stale state)
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NW bot once
        if: steps.guard.outputs.proceed == 'true'
        run: python run_nw_once.py

      - name: Commit NW state updates
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/state_nw.json data/trades_log_nw.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No NW state changes to commit"
            exit 0
          fi
          git commit -m "chore: update NW bot state [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "NW state pushed on attempt $attempt"
                exit 0
              fi
            fi
            git rebase --abort 2>/dev/null || true
            echo "Retry $attempt: another run updated main first"
            sleep $((attempt * 5))
          done
          echo "::warning::Could not push NW state after 5 attempts; next run will pick it up."
